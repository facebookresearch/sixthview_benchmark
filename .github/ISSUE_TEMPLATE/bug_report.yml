name: Bug report
description: Report a benchmark, validation, or documentation problem.
title: "[Bug] "
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the problem and what you expected to happen.
    validations:
      required: true
  - type: input
    id: example
    attributes:
      label: Example ID or affected file
      placeholder: "Example ID, input arm, or image path"
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include relevant commands and output using public information.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Repository commit
      description: Include the commit hash from git rev-parse HEAD.
